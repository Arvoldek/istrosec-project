name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select which test suite to run (default: all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - api/basics
          - api/agent
          - api/auth

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          case "${{ inputs.test_suite }}" in
            all)
              npx playwright test
              ;;
            frontend)
              npx playwright test tests/frontend/
              ;;
            api/basics)
              npx playwright test tests/api/basics/
              ;;
            api/agent)
              npx playwright test tests/api/agent/
              ;;
            api/auth)
              npx playwright test tests/api/auth/
              ;;
          esac

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html/
          retention-days: 3
